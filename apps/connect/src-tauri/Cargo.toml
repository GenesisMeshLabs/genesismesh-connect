[package]
name = "genesismesh-connect"
version = "0.1.0"
description = "Private device connections and shared files governed by Genesis Mesh"
publish = false
edition = "2024"
# Fingerprint actual package sources, not the generated Xcode project tree.
# Cargo's Git walk otherwise enters sandbox-restricted generated directories.
include = ["Cargo.toml", "build.rs", "src/**", "tauri*.conf.json", "Info.ios.plist", "icons/**", "capabilities/**"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "genesismesh_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
tauri = { version = "=2.12.4", features = [] }
connect-core = { path = "../../../crates/connect-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
tempfile = "=3.27.0"
sha2 = "0.11"
tauri-plugin-deep-link = "=2.6.2"

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
rfd = "=0.17.2"
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-view = "=0.0.5"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = {version="=2.5.4",features= ["deep-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
# deep-link 2.6.2 constructs the pre-0.21.3 ParseOption fields directly.
rust-ini = "=0.21.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
