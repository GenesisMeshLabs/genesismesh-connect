name: Connect qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/connect/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx vite build

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: core-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - run: cargo +1.98.0 fmt --all -- --check
      - name: Core, local stores, schemas and refusal cases
        run: cargo +1.98.0 test -p connect-core --features operation-schemas --locked

  authority:
    name: Real authority and Linux host
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/connect/authority/*requirements.txt
      - name: Linux native build and disposable credential service
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gnome-keyring dbus-x11
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: authority-Linux-rust-1.98-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - name: Install the single pinned authority release and packager
        run: |
          python -m pip install -r apps/connect/authority/core-requirements.txt -r apps/connect/authority/build-requirements.txt
          echo "CONNECT_NA_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo 'RUSTUP_TOOLCHAIN=1.98.0' >> "$GITHUB_ENV"
      - name: Python adapter and version checks
        working-directory: apps/connect/authority
        run: python -m unittest -v test_core_release test_owner
      - name: Native device and key lifecycle with private Secret Service
        run: |
          bash scripts/verify-linux-store.sh test -p connect-core --lib device:: --locked -- --ignored --nocapture
      - name: Real authority, QUIC, access and owner-control integration
        run: bash scripts/verify-linux-store.sh test -p connect-core --test live_authority --test access_workflow_authority --test owner_control_authority --locked -- --ignored --nocapture
      - name: Build standalone authority from installed pinned wheel
        run: python apps/connect/authority/build.py
      - name: Standalone runtime, recovery and prerequisites
        run: |
          export CONNECT_OWNER_BINARY="$PWD/apps/connect/src-tauri/binaries/genesismesh-authority-x86_64-unknown-linux-gnu"
          bash scripts/verify-linux-store.sh test -p connect-core --test owner_runtime --locked -- --ignored --nocapture
      - name: Check Linux app and headless host
        run: cargo check -p genesismesh-connect -p genesismesh-connect-node --locked

  android:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAURI_ENV_PLATFORM: android
      RUSTUP_TOOLCHAIN: 1.98.0
    defaults:
      run:
        working-directory: apps/connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/connect/package-lock.json
      - name: Install declared Rust and Android target
        run: rustup toolchain install 1.98.0 --profile minimal --target aarch64-linux-android
      - name: Configure the runner Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-arm64-rust-1.98-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'apps/connect/package-lock.json', 'apps/connect/scripts/android-init.mjs') }}
      - run: npm ci
      - run: npm run android:init -- --ci
      - run: npm run tauri -- android build --debug --apk --target aarch64 --ci
      - name: Verify and inventory APKs
        run: |
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Connect-Android-arm64-debug-${{ github.sha }}
          path: apps/connect/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
