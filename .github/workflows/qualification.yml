name: Connect qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/connect/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Guided host administration browser fixtures (installed Chrome)
        run: |
          google-chrome --version
          npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Host-administration-browser-fixtures-${{ github.sha }}
          path: apps/connect/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Android packaging refusal checks
        working-directory: .
        run: python3 -m unittest discover -s scripts/tests -p 'test_android*.py'

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: core-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - run: cargo +1.98.0 fmt --all -- --check
      - name: Core, local stores, schemas and refusal cases
        run: cargo +1.98.0 test -p connect-core --features operation-schemas --locked
      - name: Agent MCP protocol
        run: cargo +1.98.0 test -p genesismesh-connect-agent --locked
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Python owner adapter with native Windows DPAPI
        if: runner.os == 'Windows'
        working-directory: apps/connect/authority
        run: |
          python -m pip install -r core-requirements.txt
          python -m unittest -v test_core_release test_owner

  authority:
    name: Real authority and Linux host
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/connect/authority/*requirements.txt
      - name: Linux native build and disposable credential service
        timeout-minutes: 10
        run: |
          # The runner's Azure mirror stalled on individual package downloads.
          # Use Ubuntu's signed primary archive; retain APT signature checking.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gnome-keyring dbus-x11
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: authority-Linux-rust-1.98-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - name: Install the single pinned authority release and packager
        run: |
          python -m pip install -r apps/connect/authority/core-requirements.txt -r apps/connect/authority/build-requirements.txt
          echo "CONNECT_NA_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "CONNECT_FOREGROUND_FIXTURE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo 'RUSTUP_TOOLCHAIN=1.98.0' >> "$GITHUB_ENV"
      - name: Python version checks (Unix owner access is tested through Rust pipe)
        working-directory: apps/connect/authority
        run: python -m unittest -v test_core_release
      - name: Fixed embedded owner lifecycle with real core and test-only custody
        working-directory: apps/connect/authority
        run: python -m unittest -v test_embedded_owner
      - name: Native device and key lifecycle with private Secret Service
        run: |
          bash scripts/verify-linux-store.sh test -p connect-core --lib device:: --locked -- --ignored --nocapture --skip device::foreground_reopen_tests
      # These fixtures switch their process to the sealed store, a process-wide
      # setting, so they never share a process with the Secret Service tests.
      # One at a time: each releases its setup lock and takes it again at once,
      # and a child spawned by a parallel fixture keeps the lock open until exec.
      - name: Owner reopen fixtures in their own process
        run: cargo test -p connect-core --lib device::foreground_reopen_tests --locked -- --ignored --test-threads=1
      - name: Real authority, QUIC, access and owner-control integration
        run: bash scripts/verify-linux-store.sh test -p connect-core --test live_authority --test access_workflow_authority --test owner_control_authority --test owner_requests_authority --test owner_admin_authority --locked -- --ignored --nocapture
      - name: Build standalone authority from installed pinned wheel
        run: python apps/connect/authority/build.py
      - name: Standalone runtime, recovery and prerequisites
        run: |
          export CONNECT_OWNER_BINARY="$PWD/apps/connect/src-tauri/binaries/genesismesh-authority-x86_64-unknown-linux-gnu"
          bash scripts/verify-linux-store.sh test -p connect-core --test owner_runtime --test owner_requests_authority --test owner_admin_authority --locked -- --ignored --nocapture
      - name: Check Linux app and headless host
        run: cargo check -p genesismesh-connect -p genesismesh-connect-node -p genesismesh-connect-agent --locked

  journeys:
    # Whole journeys through real processes: a node with the packaged authority,
    # devices that pair, share, send, restart and wait out an outage. Its own
    # job so it runs alongside the real-authority job.
    name: Journeys on a real node
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/connect/authority/*requirements.txt
      - name: Linux native build
        timeout-minutes: 10
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb gnome-keyring dbus-x11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/connect/package-lock.json
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: journeys-Linux-rust-1.98-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - name: Install the single pinned authority release and packager
        run: |
          python -m pip install -r apps/connect/authority/core-requirements.txt -r apps/connect/authority/build-requirements.txt
          echo "CONNECT_NA_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo 'RUSTUP_TOOLCHAIN=1.98.0' >> "$GITHUB_ENV"
      - name: Build standalone authority from installed pinned wheel (the app bundles it)
        run: python apps/connect/authority/build.py
      - name: App commands (waits, downloads, sends, sharing, lifecycle)
        run: cargo test -p genesismesh-connect --lib --locked
      - name: Pair, share, send, resume, restart and outage journeys on a real node
        run: |
          export CONNECT_OWNER_BINARY="$PWD/apps/connect/src-tauri/binaries/genesismesh-authority-x86_64-unknown-linux-gnu"
          cargo test -p genesismesh-connect-node --test node --locked -- --ignored --nocapture
      - name: Build the desktop app with its debug-only journey hooks, and the test device
        run: |
          (cd apps/connect && npm ci && npx tsc --noEmit && npx vite build)
          cargo build -p genesismesh-connect --bin genesismesh-connect --features tauri/custom-protocol,webdriver --locked
          cargo build -p connect-core --example second_device --locked
          cargo install tauri-driver --locked --version 2.1.0
      - name: Desktop journey through the app (create, invite, approve, send closed partway and continued, remove, restart)
        env:
          CONNECT_OUT: ${{ github.workspace }}/temp/desktop-journey
        run: bash apps/connect/tests/desktop/run.sh target/debug/genesismesh-connect target/debug/examples/second_device
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Desktop-journey-${{ github.sha }}
          path: temp/desktop-journey/
          if-no-files-found: ignore
          retention-days: 7

  desktop-windows:
    # The same desktop journey through the Windows app in WebView2, with the
    # authority it bundles and the owner key protected by DPAPI. The runner is
    # thrown away afterwards: the app keeps its data in the account's folders.
    name: Desktop journey on Windows
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/connect/authority/*requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/connect/package-lock.json
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - name: Install the single pinned authority release and packager
        run: |
          python -m pip install -r apps/connect/authority/core-requirements.txt -r apps/connect/authority/build-requirements.txt
          "RUSTUP_TOOLCHAIN=1.98.0" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build standalone authority from installed pinned wheel (the app bundles it)
        run: python apps/connect/authority/build.py
      - name: Build the desktop app with its debug-only journey hooks, and the test device
        run: |
          Push-Location apps/connect
          npm ci
          npx tsc --noEmit
          npx vite build
          Pop-Location
          cargo build -p genesismesh-connect --bin genesismesh-connect --features tauri/custom-protocol,webdriver --locked
          cargo build -p connect-core --example second_device --locked
          cargo install tauri-driver --locked --version 2.1.0
      - name: Desktop journey through the app (create, invite, approve, send closed partway and continued, remove, restart)
        env:
          CONNECT_OUT: ${{ github.workspace }}/temp/desktop-journey
        run: ./apps/connect/tests/desktop/run.ps1 target/debug/genesismesh-connect.exe target/debug/examples/second_device.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Desktop-journey-Windows-${{ github.sha }}
          path: temp/desktop-journey/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAURI_ENV_PLATFORM: android
      RUSTUP_TOOLCHAIN: 1.98.0
    defaults:
      run:
        working-directory: apps/connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/connect/package-lock.json
      - name: Install declared Rust and Android target
        run: rustup toolchain install 1.98.0 --profile minimal --target aarch64-linux-android
      - name: Configure the runner Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-arm64-rust-1.98-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'apps/connect/package-lock.json', 'apps/connect/scripts/android-init.mjs') }}
      - run: npm ci
      - name: Build an isolated physical-test package
        run: |
          mkdir -p temp
          printf '%s\n' '{"identifier":"org.genesismesh.connect.qualification","productName":"Genesis Mesh Connect Test"}' > temp/qualification.conf.json
          npm run android:init -- --ci --config temp/qualification.conf.json
          npm run tauri -- android build --debug --apk --target aarch64 --ci --config temp/qualification.conf.json
      - name: Verify and inventory APKs
        run: |
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            python3 ../../scripts/check-android-apk.py "$apk"
            sha256sum "$apk"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Connect-Android-arm64-debug-${{ github.sha }}
          path: apps/connect/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  android-emulator:
    # Journey 5 on Android, on an emulator: the app joins a network that a
    # headless Connect node runs on this runner, sends a laptop (the
    # second_device example) a file, is stopped partway the way Android stops
    # an app, and continues after it opens again; the laptop must receive the
    # same bytes once. This is emulator evidence, not a physical phone.
    name: Android emulator journey
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      AVD_IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/connect/authority/*requirements.txt
      - name: Keyring for the test laptop
        timeout-minutes: 10
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y gnome-keyring dbus-x11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/connect/package-lock.json
      - name: Install declared Rust and the emulator's Android target
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-linux-android
      - name: Configure the runner Android SDK and the emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' platform-tools emulator "$AVD_IMAGE" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-emulator-rust-1.98-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'apps/connect/package-lock.json', 'apps/connect/scripts/android-init.mjs') }}
      - name: Install the single pinned authority release and packager
        run: |
          python -m pip install -r apps/connect/authority/core-requirements.txt -r apps/connect/authority/build-requirements.txt
          echo "CONNECT_NA_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Build the standalone authority the node runs
        run: python apps/connect/authority/build.py
      - name: Build the headless node and the test laptop
        run: |
          cargo build -p genesismesh-connect-node --locked
          cargo build -p connect-core --example second_device --locked
      - name: Build the debug test APK for the emulator, with its debug-only journey hooks
        working-directory: apps/connect
        env:
          TAURI_ENV_PLATFORM: android
        run: |
          npm ci
          mkdir -p temp
          printf '%s\n' '{"identifier":"org.genesismesh.connect.qualification","productName":"Genesis Mesh Connect Test"}' > temp/qualification.conf.json
          npm run android:init -- --ci --config temp/qualification.conf.json
          npm run tauri -- android build --debug --apk --target x86_64 --ci --config temp/qualification.conf.json --features webdriver
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          test "${#apks[@]}" -eq 1
          echo "JOURNEY_APK=$PWD/${apks[0]}" >> "$GITHUB_ENV"
      - name: Start the emulator
        timeout-minutes: 20
        run: |
          trap 'tail -60 "$RUNNER_TEMP/emulator.log" || true' ERR
          # Hardware acceleration for the emulator on the hosted Linux runner.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # One place for the virtual device, for the tool that creates it and
          # the emulator that looks for it.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n journey -k "$AVD_IMAGE" -d pixel_6
          # One adb daemon, started before the emulator looks for it: started
          # by both at once, one of them fails.
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd journey -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 4096 -cores 4 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          sleep 30
          pgrep -a qemu || echo "The emulator is not running"
          tail -40 "$RUNNER_TEMP/emulator.log"
          adb devices
          timeout 300 adb wait-for-device
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.release
          adb shell dumpsys package com.google.android.webview | grep -m1 versionName || true
      - name: Android journey through the app (join, send stopped partway and continued, reopen)
        env:
          CONNECT_OUT: ${{ github.workspace }}/temp/android-journey
        run: >-
          bash apps/connect/tests/android/run.sh "$JOURNEY_APK"
          target/debug/genesismesh-connect-node target/debug/examples/second_device
          apps/connect/src-tauri/binaries/genesismesh-authority-x86_64-unknown-linux-gnu
      - name: Keep the emulator's log
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p temp/android-journey
          timeout 60 adb logcat -d > temp/android-journey/logcat.txt 2>&1 || true
          cp "$RUNNER_TEMP/emulator.log" temp/android-journey/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Android-emulator-journey-${{ github.sha }}
          path: temp/android-journey/
          if-no-files-found: ignore
          retention-days: 7
