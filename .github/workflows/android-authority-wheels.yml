name: Android authority source wheels

on:
  pull_request:
    paths:
      - '.github/workflows/android-authority-wheels.yml'
      - 'scripts/android-authority*'
      - 'scripts/android_authority*'
      - 'scripts/android-authority-patches/**'
      - '.gitattributes'
      - 'scripts/tests/test_native_*.py'
      - 'scripts/tests/test_android_apk.py'
      - 'scripts/check-android-apk.py'
      - 'apps/connect/authority/core-requirements.txt'
  workflow_dispatch:
    inputs:
      package:
        description: Native package to qualify (external library recipes may still be required)
        required: true
        default: all
        type: choice
        options: [all, pydantic-core, cryptography, PyNaCl, cffi]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-source-${{ github.ref }}-${{ inputs.package || 'all' }}
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.package == 'pydantic-core' && '["pydantic-core"]' || inputs.package == 'cryptography' && '["cryptography"]' || inputs.package == 'PyNaCl' && '["PyNaCl"]' || inputs.package == 'cffi' && '["cffi"]' || '["pydantic-core","cryptography","PyNaCl","cffi"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PACKAGE: ${{ matrix.package }}
      RUSTUP_TOOLCHAIN: 1.98.0
      ANDROID_API_LEVEL: '24'
      CIBW_BUILD: cp313-android_arm64_v8a
      CIBW_BUILD_FRONTEND: build
      CIBW_ENVIRONMENT: RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/connect/authority/core-requirements.txt
            scripts/android-authority-build-requirements.txt
      - name: Install pinned core metadata and wheel tooling
        run: |
          python -c "import json; print('cffi==' + json.load(open('scripts/android-authority-sources.lock.json'))['packages']['cffi']['version'])" > "$RUNNER_TEMP/connect-native-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/connect-native-constraints.txt" >> "$GITHUB_ENV"
          python -m pip install -c "$RUNNER_TEMP/connect-native-constraints.txt" -r apps/connect/authority/core-requirements.txt -r scripts/android-authority-build-requirements.txt
      - name: Prepare exact hash-locked upstream source
        run: |
          native_build_root="$RUNNER_TEMP/connect-native-source"
          echo "BUILD_ROOT=$native_build_root" >> "$GITHUB_ENV"
          python scripts/android_authority_sources.py prepare --package "$PACKAGE" --output "$native_build_root"
          if test "$PACKAGE" = PyNaCl; then
            printf 'CIBW_ENVIRONMENT=%s SODIUM_INSTALL=system\n' "$CIBW_ENVIRONMENT" >> "$GITHUB_ENV"
            echo "CIBW_BEFORE_BUILD=python \"$GITHUB_WORKSPACE/scripts/android_authority_native.py\" \"{package}\"" >> "$GITHUB_ENV"
          fi
          if test "$PACKAGE" = cffi; then
            echo "CIBW_BEFORE_BUILD=python \"$GITHUB_WORKSPACE/scripts/android_authority_native.py\" \"{package}\" --kind ffi" >> "$GITHUB_ENV"
          fi
      - name: Source and target refusal tests
        run: python -m unittest discover -s scripts/tests -p 'test_native_*.py' -v
      - name: Install declared Rust and Android target
        run: rustup toolchain install 1.98.0 --profile minimal --target aarch64-linux-android
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/cibuildwheel
            ~/.cargo/registry
            ~/.cargo/git
          key: android-authority-${{ env.PACKAGE }}-${{ hashFiles('scripts/android-authority-sources.lock.json', 'scripts/android-authority-native.lock.json', 'scripts/android-authority-build-requirements.txt') }}
      - name: Cross-build Android arm64 wheel (device execution is a separate gate)
        run: |
          set -euo pipefail
          python -m cibuildwheel "$BUILD_ROOT/project" --platform android --archs arm64_v8a --output-dir "$BUILD_ROOT/wheels" 2>&1 | tee "$BUILD_ROOT/build.log"
      - name: Verify native target and alignment
        run: |
          mapfile -t wheels < <(find "$BUILD_ROOT/wheels" -name '*.whl')
          test "${#wheels[@]}" -gt 0
          for wheel in "${wheels[@]}"; do
            python scripts/android_authority_sources.py check "$wheel"
          done
      - name: Keep source provenance, wheel and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-authority-${{ env.PACKAGE }}-${{ github.sha }}
          path: |
            ${{ env.BUILD_ROOT }}/source-report.json
            ${{ env.BUILD_ROOT }}/project/connect-native-report.json
            ${{ env.BUILD_ROOT }}/build.log
            ${{ env.BUILD_ROOT }}/wheels/
          if-no-files-found: warn
          retention-days: 7

  closure:
    name: Complete Android dependency closure
    needs: wheel
    if: github.event_name == 'pull_request' || inputs.package == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/android-authority-build-requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Android-authority-*
          path: temp/native-input
      - name: Collect exactly the reviewed source-wheel set
        run: python scripts/android_authority_bundle.py collect --input temp/native-input --output temp/native-wheelhouse
      - name: Resolve the unchanged core and complete binary dependencies
        run: python scripts/probe-android-authority.py --wheelhouse temp/native-wheelhouse --output temp/native-closure
      - name: Verify target markers, Python requirements, metadata and native alignment
        run: python scripts/android_authority_bundle.py verify temp/native-closure/wheels
      - name: Preserve complete closure and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Complete-Android-authority-dependencies-${{ github.sha }}
          path: |
            temp/native-closure/
            temp/native-wheelhouse/
          if-no-files-found: warn
          retention-days: 7
