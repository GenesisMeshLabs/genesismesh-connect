name: Android owner focused checks

on:
  push:
    branches: ['android/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner:
    name: Real-core lifetime, root isolation and routine membership
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the single pinned core release
        run: 'python -m pip install --only-binary=:all: -r apps/connect/authority/core-requirements.txt'
      - run: python -m pip check
      # Deliberately enumerate the permitted checks. Do not discover or invoke
      # the full embedded-owner suite, which includes excluded startup failures.
      - name: Focused real-core checks with test-only encrypted custody
        working-directory: apps/connect/authority
        run: >-
          python -m unittest -v
          test_owner_lifetime test_owner_root test_owner_maintenance test_android_storage
          test_embedded_owner.EmbeddedOwnerTests.test_real_create_close_reopen_preserves_all_identities_and_member
          test_embedded_owner.EmbeddedOwnerTests.test_every_private_identity_is_durable_before_core_can_publish_it
