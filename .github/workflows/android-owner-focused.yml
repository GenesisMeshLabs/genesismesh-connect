name: Android owner focused checks

on:
  push:
    branches: ['android/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner:
    name: Real-core lifetime, root isolation and routine membership
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the single pinned core release
        run: 'python -m pip install --only-binary=:all: -r apps/connect/authority/core-requirements.txt'
      - run: python -m pip check
      - name: Android KeyInfo per-use policy regression (no device/custody access)
        run: python -m unittest discover -s scripts/tests -p test_android_root_policy.py -v
      - name: Native owner session guard regression (no device/custody access)
        run: python -m unittest discover -s scripts/tests -p test_android_owner_bridge.py -v
      - name: Authentication precedes protected cipher input (no device/custody access)
        run: python -m unittest discover -s scripts/tests -p test_android_record_cipher.py -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: '24'
      - name: Isolated qualification packaging
        run: node --experimental-strip-types --test apps/connect/tests/android-owner-packaging.test.ts
      # Deliberately enumerate the permitted checks. Do not discover or invoke
      # the full embedded-owner suite, which includes excluded startup failures.
      - name: Focused real-core checks with test-only encrypted custody
        working-directory: apps/connect/authority
        run: >-
          python -m unittest -v
          test_owner_lifetime test_owner_root test_owner_maintenance test_android_storage test_connect_embedded test_android_bootstrap
          test_membership_inspection
          test_embedded_owner.EmbeddedOwnerTests.test_real_create_close_reopen_preserves_all_identities_and_member
          test_embedded_owner.EmbeddedOwnerTests.test_every_private_identity_is_durable_before_core_can_publish_it

  native:
    name: Native owner transport boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the declared minimum Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: owner-native-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            core-${{ runner.os }}-rust-1.98-
      - run: cargo +1.98.0 test -p connect-core --test owner_native_transport --test owner_native_protocol --test membership_inspection --test foreground_setup --locked
      - run: cargo +1.98.0 test -p connect-core --lib owner::tests --locked
      - run: cargo +1.98.0 test -p connect-core --lib session::pairing::tests::control_dispatch_checks_live_exact_target_before_callback_and_holds_gate --locked
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the pinned core for disposable foreground fixtures
        run: 'python -m pip install --only-binary=:all: -r apps/connect/authority/core-requirements.txt'
      - name: Explicit foreground coordinator fixtures (no devices/startup fault injection)
        run: CONNECT_FOREGROUND_FIXTURE_PYTHON="$(command -v python)" cargo +1.98.0 test -p connect-core --test foreground_owner --test foreground_pairing --locked -- --ignored
