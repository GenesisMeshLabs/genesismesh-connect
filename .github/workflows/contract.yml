name: Connect contract and journey coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Inventory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check release pins, reviewed mappings and generated output
        run: node scripts/connect-contract.mjs check
      - name: Exercise drift and false-acceptance refusals
        run: node --test scripts/tests/connect-contract.test.mjs
      - name: Verify upstream provenance
        run: node scripts/connect-contract.mjs verify-upstream

  operation-schemas:
    name: Native operation schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared minimum Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Check generated schemas and closed operation inputs
        run: cargo +1.98.0 test -p connect-core --features operation-schemas --lib --test operation_registry --test access_history --test owner_control --test admin_key_sealed --locked
