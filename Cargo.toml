[workspace]
members = ["crates/connect-core", "apps/connect/src-tauri"]
exclude = ["vendor/n0-dns-resolver", "vendor/tauri-plugin-view"]
default-members = ["crates/connect-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }

# Temporary iOS compatibility fix; see shellrow/netdev#195.
# Pin the reviewed revision until an upstream release includes it.
[patch.crates-io]
netdev = { git = "https://github.com/shellrow/netdev", rev = "b3bfb0fb5595cd143bfa0b9f07d1ad6e0ef0c313" }
# 0.1.0 uses macOS-only DynamicStore APIs on iOS; see vendor patch notes.
n0-dns-resolver = { path = "vendor/n0-dns-resolver" }
tauri-plugin-view = { path = "vendor/tauri-plugin-view" }

# Keep this spike's Windows build output modest.
[profile.dev]
debug = 0

[profile.test]
debug = 0
